<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow Command Post</title>
<!-- Everything inline: the command post has no internet. -->
<style>
  :root {
    --bg: #0f1216; --panel: #181d23; --line: #2a313a; --text: #e8edf2; --dim: #8b96a3;
    --ok: #2fb36b; --warn: #e0a526; --bad: #e5484d; --unknown: #6b7684;
    --p1: #e5484d; --p2: #f2802e; --p3: #e0c026; --p4: #6b7684;
  }
  * { box-sizing: border-box; }
  /* Everything is sized in rem and the root grows with the window, so the
     same page reads on a laptop and from the back of a room on a projector. */
  html { font-size: clamp(16px, 0.6rem + 0.9vw, 30px); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.1rem; margin: 0 auto 0 0; letter-spacing: .04em; }
  .pill { padding: .25em .75em; border-radius: 999px; font-weight: 700; font-size: .9rem; }
  .up { background: var(--ok); color: #04130a; }
  .down { background: var(--bad); color: #fff; }
  .waiting, .unknown { background: var(--unknown); color: #fff; }
  .sim { background: var(--warn); color: #1d1503; }
  #stale { display: none; background: var(--bad); color: #fff; font-weight: 700;
           padding: 10px 16px; }
  main { padding: 16px; max-width: 60rem; margin: 0 auto; }
  section { margin-bottom: 20px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 6px; padding: .2em .5em;
          font-size: .9rem; display: flex; gap: .4em; align-items: center; }
  .dot { width: .6em; height: .6em; border-radius: 50%; }
  .dot.ok { background: var(--ok); } .dot.degraded { background: var(--warn); }
  .dot.down { background: var(--bad); } .dot.unknown { background: var(--unknown); }
  .note { color: var(--dim); font-size: .9rem; margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-left: .5rem solid var(--p4); border-radius: 8px;
          padding: .75rem .9rem; margin-bottom: .6rem; }
  .card.p1 { border-left-color: var(--p1); } .card.p2 { border-left-color: var(--p2); }
  .card.p3 { border-left-color: var(--p3); }
  .card.old { opacity: .6; }
  .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .prio { font-weight: 800; font-size: 1.5rem; }
  .card.p1 .prio { color: var(--p1); }
  .label { color: var(--dim); font-weight: 600; }
  .heard { margin-left: auto; color: var(--dim); font-size: .9rem; }
  .facts { display: flex; flex-wrap: wrap; gap: .25em 1.1em; margin-top: .4em;
           font-size: 1.1rem; }
  .history { display: flex; flex-wrap: wrap; gap: .3em; align-items: center;
             margin-top: .6em; font-size: .8rem; color: var(--dim); }
  .step { border: 1px solid var(--line); border-left: .3em solid var(--p4);
          border-radius: 4px; padding: .1em .45em; }
  .step.p1 { border-left-color: var(--p1); } .step.p2 { border-left-color: var(--p2); }
  .step.p3 { border-left-color: var(--p3); }
  .danger { color: var(--bad); font-weight: 700; }
  .caution { color: var(--warn); font-weight: 700; }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>AFTERGLOW · COMMAND POST</h1>
  <span id="sim" class="pill sim" hidden>SIM DATA</span>
  <span id="link" class="pill waiting">LINK: WAITING</span>
</header>
<div id="stale"></div>
<main>
  <section>
    <h2>Victims</h2>
    <div id="victims"><div class="empty">Connecting to the map server…</div></div>
  </section>
  <section>
    <h2>Field node</h2>
    <div id="node" class="chips"></div>
    <div id="link-note" class="note"></div>
  </section>
  <section>
    <h2>Command post</h2>
    <div id="post" class="chips"></div>
  </section>
</main>
<script>
"use strict";
const POLL_MS = 1000, STALE_MS = 3000, OLD_S = 120;
const LABEL = {1: "URGENT", 2: "CONFIRMED", 3: "POSSIBLE", 4: "DEVICE ONLY"};
let lastOk = Date.now();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function ago(s) {
  if (s < 60) return Math.round(s) + " s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  return (s / 3600).toFixed(1) + " h ago";
}

function chips(id, modules) {
  const box = document.getElementById(id);
  box.replaceChildren(...modules.map(m => {
    const c = el("span", "chip");
    c.append(el("span", "dot " + m.state), el("span", "", m.name + ": " + m.state));
    return c;
  }));
}

function card(v) {
  const c = el("div", "card p" + v.p + (v.heard_s > OLD_S ? " old" : ""));
  const top = el("div", "top");
  top.append(el("span", "prio", "P" + v.p), el("span", "label", LABEL[v.p]),
             el("span", "", "track " + v.id),
             el("span", "heard", "heard " + ago(v.heard_s) + " (" + v.heard_at + ")"));
  const facts = el("div", "facts");
  facts.append(el("span", "", v.alive ? "Alive" : "Life not confirmed"));
  facts.append(el("span", "", v.br === null ? "breathing unknown" : "breathing " + v.br + "/min"));
  facts.append(el("span", "", "confidence " + v.c + "%"));
  facts.append(el("span", "", v.rng === null ? "near searcher, range unknown"
                  : v.rng < 1 ? "under 1 m from searcher" : "within " + v.rng + " m of searcher"));
  facts.append(v.hz === null ? el("span", "", "gas: no reading")
               : el("span", v.hz === "none" ? "" : v.hz, "gas: " + v.hz));
  c.append(top, facts);
  if (v.history.length > 1) c.append(history(v.history));
  return c;
}

// How this victim got here: "P4 12% 15:05:54 → P3 62% 15:06:06 → ...".
function history(steps) {
  const row = el("div", "history");
  steps.forEach((s, i) => {
    if (i) row.append(el("span", "", "→"));
    const what = "P" + s.p + " " + s.c + "%" + (s.br === null ? "" : ", breathing " + s.br + "/min");
    row.append(el("span", "step p" + s.p, what + " · " + s.at));
  });
  return row;
}

function render(s) {
  const link = document.getElementById("link");
  link.className = "pill " + s.link;
  link.textContent = "LINK: " + s.link.toUpperCase();
  document.getElementById("sim").hidden = s.sim !== true;
  const note = document.getElementById("link-note");
  if (s.link === "waiting") note.textContent = "No beacon from the node yet.";
  else note.textContent = "Last beacon " + ago(s.beacon_age_s) + "; " + s.missed + " lost in the air." +
    (s.link === "down" ? " Node status unknown until the link is back." : "");
  chips("node", s.node);
  chips("post", s.post);
  const box = document.getElementById("victims");
  if (s.victims.length) {
    box.replaceChildren(...s.victims.map(card));
  } else {
    box.replaceChildren(el("div", "empty", s.link === "up"
      ? "No victims reported."
      : "No victims received, but the link is " + s.link + ": that is not the same as none found."));
  }
}

async function poll() {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), POLL_MS * 2);
    const r = await fetch("/state", {cache: "no-store", signal: ctl.signal});
    clearTimeout(timer);
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    lastOk = Date.now();
  } catch (e) { /* shown by the stale banner below */ }
  const stale = document.getElementById("stale");
  const quiet = Date.now() - lastOk;
  stale.style.display = quiet > STALE_MS ? "block" : "none";
  stale.textContent = "MAP SERVER NOT RESPONDING for " + Math.round(quiet / 1000) +
    " s: everything below is out of date.";
  setTimeout(poll, POLL_MS);
}
poll();
</script>
</body>
</html>
