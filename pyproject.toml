[project]
name = "afterglow"
version = "0.1.0"
description = "Search-and-rescue sensing node: find, confirm, relay over LoRa to TAK"
requires-python = ">=3.11"
dependencies = [
    "honcho>=2.0.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
