# Afterglow configuration. Every weight, threshold, timing, port and device
# path lives here; code reads it through common.config.get_config().

sim: true                # fake hardware everywhere; set false on the Pi

bus:
  host: 127.0.0.1
  settle_s: 0.3          # pause after a publisher connects so early messages aren't dropped
  hwm: 1000              # max messages queued per socket; beyond this the newest are dropped
  bad_msg_log_s: 10      # warn about dropped bad messages at most this often, with a count
  # The node and the command post each run their own bus. Separate ports let
  # both run on one laptop in sim mode.
  node: {pub_port: 5550, sub_port: 5551}
  post: {pub_port: 5560, sub_port: 5561}

service:                 # crashed modules restart after backoff_min_s,
  backoff_min_s: 1       # doubling each time up to backoff_max_s
  backoff_max_s: 30

log:
  level: INFO
  dir: logs              # bus recordings, relative to the repo root
  fsync_s: 1             # force recordings to disk this often
  min_free_mb: 500       # pause recording below this much free disk

privacy:
  salt: afterglow-2026   # salt for device-ID hashes (common/ids.py)
  hash_chars: 16         # hex characters kept from the SHA-256 digest; 16+, so a hash never looks like a MAC

targets:
  # Hashed IDs of our own test devices (common.ids.hash_device). Never put raw MACs here.
  # Changing the salt or hash_chars changes every hash: re-hash these too.
  devices:
    - 2efae4bfcede1097   # fake scenario victim phone (tools/fake_detections.py)
  # true: fusion ignores every device not listed above (demo and testing: only
  # our own devices, and bystanders' phones can't flood the link or lend their
  # signal to a heat pack). false for a real search, where the victim's device
  # isn't known in advance.
  known_only: true

rf:
  p1m_dbm: -45           # RSSI at 1 m; calibrate on site
  path_loss_n: 3.0       # log-distance path-loss exponent (1-6); calibrate on site
  smooth_window_s: 2.5   # RSSI moving-average window
  smooth_max_samples: 100  # readings kept per device, whatever the window
  max_devices: 500       # devices the smoother remembers; the longest-quiet is forgotten first
  e_full_dbm: -60        # e_rf = 1 at or above this
  e_zero_dbm: -90        # e_rf = 0 at or below this

fusion:
  weights: {rf: 0.5, thermal: 0.7, radar: 0.7, audio: 0.4}
  breath_min: 6          # a breathing rate in this range (per minute) is full radar evidence
  breath_max: 30
  max_skew_s: 10         # drop messages stamped further than this from fusion's clock

triage:
  confirmed: 0.8         # C at or above: P1 or P2
  possible: 0.5          # C at or above: P3; below: P4

tracks:
  bearing_merge_deg: 20  # merge hits whose bearings are this close...
  window_s: 30           # ...and were seen within this window; older bearings and ranges are unknown
  focus_s: 5             # thermal/radar hits this recent mean the searcher is at that track
  radar_merge_m: 1.5     # a radar hit joins a track only if this close to its last radar range
  confirm_range_m: 8     # a newly confirmed person joins a device estimated this close
  keep_s: 600            # forget a device-only track after this long unheard (confirmed tracks stay)
  max_tracks: 256        # when full, unconfirmed tracks without a known device go first
  max_devs: 16           # device hashes remembered per track
  demote_s: 10           # priority rises at once, but drops only after the lower one holds this long
  resend_s: 30           # resend P1/P2 alerts this often; must be under tak.stale_s
  # Track ids and confirmed tracks survive restarts here. Not under logs/, so
  # clearing recordings can't reset ids and overwrite markers at the command post.
  state_dir: state

health:
  beat_s: 2              # every long-running module publishes a heartbeat this often

relay:
  ack_timeout_s: 10      # retry with back-off if no ack within this
  max_alert_bytes: 100

hazard:
  caution_x: 1.5         # gas reading at this multiple of the clean-air baseline
  danger_x: 2.5

wifi:
  iface: wlan1
  channels: [1, 6, 11]

thermal:
  i2c_addr: 0x33

serial:                  # check with `ls /dev/tty*` after plugging in
  radar: /dev/ttyAMA0
  gas: /dev/ttyACM0
  lora: /dev/ttyUSB0

tak:
  url: udp://239.2.3.1:6969
  uid_prefix: AG-
  stale_s: 120
